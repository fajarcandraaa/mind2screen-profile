name: Deploy to GitHub Pages

on:
  push:
    branches: [development]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy
        uses: actions/deploy@v1
        with:
          provider: pages
          github-token: ${{ secrets.PROFILETOKEN }}
          publish-dir: ./dist
